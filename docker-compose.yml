services:

  db:
    image: postgres:latest
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "sh -c 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB'" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    env_file: .env
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:latest
    ports:
      - 8097:80
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/var/html/static
      - media_volume:/var/html/media
    depends_on:
      - backend

  redis:
    image: redis:latest
    command: --port 6381
    ports:
      - "6381:6379"
    restart: always

  celery:
    build: .
    command: celery -A config worker --loglevel=info --logfile=/var/log/celery/celery_worker.log --max-tasks-per-child=100
    volumes:
      - ./logs:/var/log/celery
    env_file:
      - .env
    depends_on:
      - backend
      - redis


volumes:
  postgres_data:
  static_volume:
  media_volume: